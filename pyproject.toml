[project]
name = "tarning-tests"
version = "0.1.0"
description = "Test harness for the static dice page (not shipped)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.6", "playwright>=1.47,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["sitecheck"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".factory", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"integration/**" = ["S101", "S603", "S607"]
